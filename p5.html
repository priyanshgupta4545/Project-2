<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:nth-child(2n){
            color: greenyellow;
        }
        li:nth-child(2n){
            color: blue;
        }
        li:nth-last-child(2n+1){
            color: burlywood;
        }
    </style>
</head>
<body>
    <h1>Css selector</h1>
    <ol>
        <li>Java script</li>
        <li>Html</li>
        <li>css</li>
        <li>spring</li>
        <li>springboot</li>
        <li>React</li>
        <li>Nodejs</li>
        <li>java</li>
        <li>python</li>
    </ol>
</body>
</html>
